name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate -w apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes (API)
        run: npm test

      - name: Build
        run: npm run build

  docker-api:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker da API
        run: docker build -f apps/api/Dockerfile -t nexo-mangue-api .
